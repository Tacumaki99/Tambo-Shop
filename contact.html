                <button class="navbar-toggler" type="button" onclick="myFunction()">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
            <div class="navbar-collapse  nav" id="mainNav">
                <ul class="navbar-nav ms-auto fs-5" id = 'navigation'>

</header>

<main class="reservation-page">

    <section class="container py-5">

        <div class="text-center mb-5">

            <h1 class="display-3 fw-bold">
                CONTACT US
            </h1>

            <p class="lead">
                Fill the form below and we will get back to you.
            </p>

        </div>

        <div class="reservation-wrapper shadow-sm">

            <form action="#" method="post">

                <div class="row g-4">

                    <div class="col-md-6">

                        <label class="form-label">
                            First name *
                        </label>

                        <input type="text"
                               class="form-control"
                               placeholder="Letters, spaces, hyphens">

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">
                            Last name *
                        </label>

                        <input type="text"
                               class="form-control"
                               placeholder="Letters, spaces, hyphens">

                    </div>

                    <div class="col-12">

                        <label class="form-label">
                            Email *
                        </label>

                        <input type="email"
                               class="form-control"
                               placeholder="e.g. name@example.com">

                    </div>

                    <div class="col-12">

                        <label class="form-label">
                            Reason for contact *
                        </label>

                        <select class="form-select">

                            <option selected disabled>
                                Select a reason...
                            </option>

                            <option>
                                Reservation
                            </option>

                            <option>
                                Catering
                            </option>

                            <option>
                                Workshop
                            </option>

                            <option>
                                Product Question
                            </option>

                        </select>

                    </div>

                    <div class="col-12">

                        <label class="form-label">
                            More details *
                        </label>

                        <textarea class="form-control"
                                  rows="6"
                                  placeholder="Write your message here..."></textarea>

                    </div>

                    <div class="col-12">

                        <div class="form-check">

                            <input class="form-check-input"
                                   type="checkbox">

                            <label class="form-check-label">
                                Subscribe me to the newsletter
                            </label>

                        </div>

                    </div>

                    <div class="col-12">

                        <button type="submit"
                                class="btn submit-btn w-100 py-3">
                            Submit
                        </button>

                    </div>

                </div>

            </form>

        </div>

    </section>

</main>
